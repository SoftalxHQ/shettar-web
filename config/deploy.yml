# Name of your application. Used to uniquely configure containers.
service: shettar_web

# Name of the container image.
image: alexohre/shettar_web

# Deploy to these servers.
servers:
  web:
    - 168.119.109.209

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  hosts:
    - shettar.com
  # Next.js standalone listens on 3000 (not 80).
  app_port: 3000

deploy_timeout: 120
drain_timeout: 30

# Credentials for your image host (Docker Hub).
registry:
  username: alexohre
  password:
    - KAMAL_REGISTRY_PASSWORD

# Runtime env (secrets come from .kamal/secrets).
# NEXT_PUBLIC_* are also passed as builder args/secrets so they are baked into the client bundle.
env:
  clear:
    NODE_ENV: production
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    NEXT_PUBLIC_API_URL: https://api-v1.shettar.com
    NEXT_PUBLIC_APP_ENV: production
    NEXT_PUBLIC_ANDROID_APP_URL: https://play.google.com/store/apps/details?id=com.softalx.shettar
  secret:
    - NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
    - NEXT_PUBLIC_GOOGLE_CLIENT_ID
    - NEXT_PUBLIC_IOS_APP_URL
    - NEXT_PUBLIC_FIREBASE_API_KEY
    - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    - NEXT_PUBLIC_FIREBASE_PROJECT_ID
    - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    - NEXT_PUBLIC_FIREBASE_APP_ID
    - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    - NEXT_PUBLIC_FCM_VAPID_KEY
    - NEXT_PUBLIC_TIDIO_KEY
    - NEXT_PUBLIC_TURNSTILE_SITE_KEY
    - NEXT_PUBLIC_BROWSE_GATE_ENABLED

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f

# Configure the image builder.
builder:
  arch: amd64
  remote: ssh://root@168.119.109.209
  args:
    NEXT_PUBLIC_API_URL: https://api-v1.shettar.com
    NEXT_PUBLIC_APP_ENV: production
    NEXT_PUBLIC_ANDROID_APP_URL: https://play.google.com/store/apps/details?id=com.softalx.shettar
  secrets:
    - NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
    - NEXT_PUBLIC_GOOGLE_CLIENT_ID
    - NEXT_PUBLIC_IOS_APP_URL
    - NEXT_PUBLIC_FIREBASE_API_KEY
    - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    - NEXT_PUBLIC_FIREBASE_PROJECT_ID
    - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    - NEXT_PUBLIC_FIREBASE_APP_ID
    - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    - NEXT_PUBLIC_FCM_VAPID_KEY
    - NEXT_PUBLIC_TIDIO_KEY
    - NEXT_PUBLIC_TURNSTILE_SITE_KEY
    - NEXT_PUBLIC_BROWSE_GATE_ENABLED
