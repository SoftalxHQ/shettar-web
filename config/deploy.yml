# Name of your application. Used to uniquely configure containers.
service: shettar_web

# Name of the container image.
image: alexohre/shettar_web

# Deploy to these servers.
servers:
  web:
    - 168.119.109.209

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  hosts:
    - shettar.com
  # Next.js standalone listens on 3000 (not 80).
  app_port: 3000

deploy_timeout: 120
drain_timeout: 30

# Credentials for your image host (Docker Hub).
registry:
  username: alexohre
  password:
    - KAMAL_REGISTRY_PASSWORD

# Runtime env. NEXT_PUBLIC_* for the client bundle are baked at build from .env.production
# (copied into the Docker build context). Runtime secrets below are optional fallbacks.
env:
  clear:
    NODE_ENV: production
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    NEXT_PUBLIC_API_URL: https://api-v1.shettar.com
    NEXT_PUBLIC_APP_ENV: production
    NEXT_PUBLIC_ANDROID_APP_URL: https://play.google.com/store/apps/details?id=com.softalx.shettar

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f

# Configure the image builder.
# Remote SSH BuildKit is flaky with many secret mounts — bake env via .env.production instead.
builder:
  arch: amd64
  remote: ssh://root@168.119.109.209
  args:
    NEXT_PUBLIC_API_URL: https://api-v1.shettar.com
    NEXT_PUBLIC_APP_ENV: production
    NEXT_PUBLIC_ANDROID_APP_URL: https://play.google.com/store/apps/details?id=com.softalx.shettar
    PNPM_VERSION: "10.28.1"
